name: Release API diagnostics
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect draft release reads
        run: |
          gh --version
          echo 'Drafts in paginated list:'
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" | python3 -c 'import json,sys; p=json.load(sys.stdin); print([[dict(id=r.get("id"),tag=r.get("tag_name"),draft=r.get("draft")) for r in page] for page in p])'
          echo 'Direct release ID:'
          gh api "repos/$GH_REPO/releases/410678500" --jq '{id,tag_name,draft}' || true
          echo 'CLI tag lookup:'
          gh release view v0.1.0 --json tagName,isDraft,url || true
          echo 'Uncached paginated list:'
          gh api --paginate --slurp -H 'Cache-Control: no-cache' "repos/$GH_REPO/releases?per_page=100" | python3 -c 'import json,sys; p=json.load(sys.stdin); print([[dict(id=r.get("id"),tag=r.get("tag_name"),draft=r.get("draft")) for r in page] for page in p])'
