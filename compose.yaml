name: tatotalk-probe
services:
  android:
    build:
      context: .
      args:
        ANDROID_BASE_IMAGE: ${ANDROID_BASE_IMAGE:-budtmo/docker-android:emulator_11.0@sha256:ee03fa21a88ea86fe5be803936391d82ee1a853cb19ac6a6e0800ebfcaaf6dc2}
    image: tatotalk-android-probe:local
    platform: linux/amd64
    restart: unless-stopped
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6090}:6080"
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env (8 English letters or digits)}
      EMULATOR_ADDITIONAL_ARGS: ${EMULATOR_ADDITIONAL_ARGS:--memory 2048 -cores 2 -no-snapshot -no-boot-anim -no-audio}
      TATOTALK_APK_URL: ${TATOTALK_APK_URL:-https://downtato.ffvjei.com/android/TatoTalk-26100306.apk}
      TATOTALK_APK_SHA256: ${TATOTALK_APK_SHA256:-}
      TATOTALK_BOOT_TIMEOUT: ${TATOTALK_BOOT_TIMEOUT:-300}
      TATOTALK_EXPECTED_ABI: ${TATOTALK_EXPECTED_ABI:-arm64-v8a}
    volumes:
      - android-data:/home/androidusr
    shm_size: 1gb
    mem_limit: ${ANDROID_MEMORY_LIMIT:-6g}
    cpus: ${ANDROID_CPU_LIMIT:-2.0}
    healthcheck:
      test:
        - CMD-SHELL
        - '[ "$$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]'
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 3m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  android-data:
